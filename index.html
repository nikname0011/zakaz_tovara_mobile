<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a8a">
<title>Помощник заказа товара</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  :root {
    --blue-dark: #1e3a8a;
    --blue-mid: #1d4ed8;
    --blue-light: #eff6ff;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --orange-light: #fff7ed;
    --orange-border: #fdba74;
    --card-bg: rgba(255,255,255,0.97);
    --text: #111827;
    --text-muted: #6b7280;
    --radius: 22px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(160deg, #c7d7f7 0%, #93b4f0 30%, #1e3a8a 100%);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* SCREEN CONTAINER */
  .screen-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 12px) 14px calc(var(--safe-bottom) + 12px);
    gap: 10px;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.13);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    color: var(--blue-dark);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .title {
    font-size: 19px;
    font-weight: 900;
    color: var(--blue-dark);
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 2px;
  }

  /* SWIPE CONTAINER */
  .slides-outer {
    flex: 1;
    overflow: hidden;
    position: relative;
    border-radius: var(--radius);
  }

  .slides-track {
    display: flex;
    height: 100%;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  .slide {
    min-width: 100%;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 18px;
    background: var(--card-bg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.13);
  }

  /* Slide smooth corners when multiple */
  .slide:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .slide:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
  .slide:only-child  { border-radius: var(--radius); }

  /* PRIORITY NOTE */
  .priority-note {
    background: var(--blue-light);
    border-left: 4px solid var(--blue-mid);
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .priority-note b { color: var(--blue-dark); }

  /* STEP QUESTION */
  .step-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .question {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--blue-dark);
    margin-bottom: 18px;
  }
  .question.result-title {
    color: var(--green);
    font-size: 18px;
  }

  /* BUTTONS */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .btn {
    border: none;
    border-radius: 16px;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn:active { transform: scale(0.97); box-shadow: none !important; }
  .btn-yes  { background: var(--green); color: #fff; box-shadow: 0 4px 14px rgba(22,163,74,0.3); }
  .btn-no   { background: var(--blue-mid); color: #fff; box-shadow: 0 4px 14px rgba(29,78,216,0.3); }
  .btn-restart { background: #f3f4f6; color: #374151; box-shadow: 0 2px 8px rgba(0,0,0,0.07); font-size: 15px; }
  .btn-back    { background: #e0e7ff; color: #3730a3; box-shadow: 0 2px 8px rgba(0,0,0,0.07); font-size: 15px; }

  /* NAV BUTTONS ROW */
  .nav-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nav-btns .btn {
    flex: 1;
    justify-content: center;
    padding: 12px 10px;
    font-size: 14px;
  }

  /* RESULT BOX */
  .result-box {
    background: var(--green-light);
    border: 2px solid #22c55e;
    padding: 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    margin-bottom: 14px;
  }

  /* RULES BOX */
  .rules-box {
    background: var(--orange-light);
    border: 1px solid var(--orange-border);
    padding: 13px;
    border-radius: 14px;
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-line;
    margin-bottom: 14px;
  }
  .rules-box b { color: #92400e; }

  /* PATH */
  .path-box {
    border-top: 1px solid #e5e7eb;
    padding-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .path-box b { color: var(--text); }

  /* GLOSSARY */
  .glossary {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 12px;
    color: #64748b;
    line-height: 1.7;
    margin-top: 8px;
  }
  .glossary b { color: #334155; }

  /* DOTS NAV */
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 4px 0;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active {
    background: #fff;
    transform: scale(1.3);
  }

  /* SWIPE HINT */
  .swipe-hint {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
</style>
</head>

<div class="screen-wrap">
  <!-- HEADER -->
  <div class="header">

</div>

      { text: '✅  Да', cls: 'btn-yes', next: 'rcOrder' },
      { text: '❌  Нет', cls: 'btn-no', next: 'regionStore' }
    ]
  },
  rcOrder: {
    result: 'Ставим резерв в заказе клиента.\n\nДелаем заказ, берем аванс 30–100%.\n\n✅ Выбираем склад РЦ в заказе клиента.\n\nМожем добавить услугу доставки напрямую до клиента.',
    delivery: true
  },
  regionStore: {
    question: 'Есть в наличии в магазине региона?',
    showPriority: true,
    options: [
      { text: '✅  Да', cls: 'btn-yes', next: 'regionDelivery' },
      { text: '❌  Нет', cls: 'btn-no', next: 'anotherRegion' }
    ]
  },
  regionDelivery: {
    result: 'Запрашиваем в магазине, берем аванс.\n\nПросим переместить доставкой из региона.',
    delivery: true
  },
  anotherRegion: {
    question: 'Есть в наличии в другом регионе?',
    showPriority: true,
    options: [
      { text: '✅  Да', cls: 'btn-yes', next: 'regionDelivery' },
      { text: '❌  Нет', cls: 'btn-no', next: 'rcIncoming' }
    ]
  },
  rcIncoming: {
    question: 'Товар приедет на РЦ в ближайшие недели?',
    showPriority: true,
    options: [
      { text: '✅  Да', cls: 'btn-yes', next: 'rcIncomingYes' },
      { text: '❌  Нет', cls: 'btn-no', next: 'askKM' }
    ]
  },
  rcIncomingYes: {
    result: 'Ставим резерв в заказе клиента.\n\nДелаем заказ, берем аванс 30–100%.\n\n✅ Выбираем склад РЦ для заказа перемещения.\n\nОжидаем поступления на РЦ.',
    delivery: true
  },
  askKM: {
    result: '📞 Запрашиваем у Категорийного менеджера ориентировочные сроки поступления на РЦ.\n\nБерем заказ с авансом клиента, ожидаем поступления на РЦ.'
  },
  reserve: {
    result: 'Ставим резерв в заказе клиента.\n\nДелаем заказ, берем аванс 30–100%.'
  }
};

/* ===== STATE ===== */
let slides = []; // [{stepKey, label, isResult}]
let currentSlide = 0;
let isDragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let lockedAxis = null; // 'h' | 'v' | null
const SWIPE_THRESHOLD = 50;

const track = document.getElementById('slidesTrack');
const dotsEl = document.getElementById('dots');
const swipeHint = document.getElementById('swipeHint');

/* ===== GLOSSARY HTML ===== */
function glossaryHTML() {
  return `<div class="glossary">
    <b>РЦ</b> — распределительный центр Чехов<br>
    <b>РМК</b> — рабочее место кассира в 1С<br>
    <b>ИМ</b> — Интернет магазин
  </div>`;
}

/* ===== PRIORITY NOTE ===== */
function priorityHTML() {
  return `<div class="priority-note">
    <b>Приоритет при заказе товара offline.</b><br>
    1. РЦ &nbsp; 2. Магазин региона &nbsp; 3. Магазин флагман
  </div>`;
}

/* ===== BUILD SLIDE HTML ===== */
function buildSlideHTML(stepKey, pathSoFar, slideIndex) {
  const step = flow[stepKey];
  if (!step) return '';

  let html = '';

  // NAV BUTTONS: back + restart (on every slide except first)
  if (slideIndex > 0) {
    html += `<div class="nav-btns">`;
    html += `<button class="btn btn-back" onclick="goBack(${slideIndex})">← Шаг назад</button>`;
    html += `<button class="btn btn-restart" onclick="fullRestart()">🔄 Сначала</button>`;
    html += `</div>`;
  }

  if (step.question || step.questionHTML) {
    if (step.showPriority) html += priorityHTML();
    html += `<div class="step-label">Шаг ${pathSoFar.length + 1}</div>`;
    html += `<div class="question">${step.questionHTML ? step.questionHTML : escapeHTML(step.question)}</div>`;
    html += `<div class="btn-group" id="btnGroup_${stepKey}">`;
    const questionForPath = step.question || (step.questionHTML ? step.questionHTML.replace(/<[^>]*>/g, '') : '');
    step.options.forEach((opt, i) => {
      html += `<button class="btn ${opt.cls}" data-next="${escapeAttr(opt.next)}" data-label="${escapeAttr(questionForPath + ' → ' + opt.text)}">${opt.text}</button>`;
    });
    html += `</div>`;
  }

  if (step.result || step.resultHTML) {
    html += `<div class="question result-title">📋 Результат</div>`;
    const resultContent = step.resultHTML ? step.resultHTML : escapeHTML(step.result);
    html += `<div class="result-box">${resultContent}</div>`;

    if (step.deliveryThresholds) {
      html += `<div class="rules-box">${escapeHTML(deliveryRulesThresholds)}</div>`;
    } else if (step.delivery) {
      html += `<div class="rules-box">${escapeHTML(deliveryRulesFull)}</div>`;
    }

    if (step.returnTo) {
      html += `<button class="btn btn-no return-offline-btn" data-return-to="${escapeAttr(step.returnTo)}">${step.returnLabel || '↩ Вернуться'}</button>`;
    }
  }

  // PATH
  if (pathSoFar.length > 0) {
    html += `<div class="path-box"><b>📌 Путь:</b><br>${pathSoFar.map(escapeHTML).join('<br>')}</div>`;
  } else {
    html += `<div class="path-box">Следуйте по шагам 👆</div>`;
  }

  html += glossaryHTML();
  return html;
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str) {
  return str.replace(/"/g,'&quot;');
}

/* ===== RENDER ALL SLIDES ===== */
function renderSlides() {
  track.innerHTML = '';
  dotsEl.innerHTML = '';

  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = buildSlideHTML(s.stepKey, s.path, i);
    track.appendChild(div);

    // Button listeners
    div.querySelectorAll('[data-next]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-next');
        const label = btn.getAttribute('data-label');
        goToStep(next, label, i);
      });
    });

    div.querySelectorAll('[data-return-to]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-return-to');
        goToStep(next, '↩ Возврат в оффлайн-путь', i);
      });
    });

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentSlide ? ' active' : '');
    dotsEl.appendChild(dot);
  });

  applyTransform(false);
  updateSwipeHint();
}

/* ===== NAV ===== */
function goToStep(nextKey, pathLabel, fromIndex) {
  // Remove any slides after fromIndex
  slides = slides.slice(0, fromIndex + 1);

  const newPath = [...slides[fromIndex].path, pathLabel];
  slides.push({ stepKey: nextKey, path: newPath });
  currentSlide = slides.length - 1;
  renderSlides();
  // Animate to last slide
  requestAnimationFrame(() => applyTransform(true));
}

function fullRestart() {
  slides = [{ stepKey: 'start', path: [] }];
  currentSlide = 0;
  renderSlides();
}

function goBack(fromIndex) {
  if (fromIndex <= 0) return;
  slides = slides.slice(0, fromIndex);
  currentSlide = slides.length - 1;
  renderSlides();
  requestAnimationFrame(() => applyTransform(true));
}

/* ===== TRANSFORM ===== */
function applyTransform(animate) {
  if (animate) {
    track.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
  } else {
    track.style.transition = 'none';
  }
  track.style.transform = `translateX(${-currentSlide * 100}%)`;

  // Update dots
  dotsEl.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentSlide);
  });
  updateSwipeHint();
}

function updateSwipeHint() {
  swipeHint.style.opacity = slides.length > 1 ? '1' : '0';
}

/* ===== TOUCH / SWIPE ===== */
const outer = document.getElementById('slidesOuter');

outer.addEventListener('touchstart', onTouchStart, { passive: true });
outer.addEventListener('touchmove', onTouchMove, { passive: false });
outer.addEventListener('touchend', onTouchEnd, { passive: true });

// Mouse (desktop fallback)
outer.addEventListener('mousedown', onMouseDown);
document.addEventListener('mousemove', onMouseMove);
document.addEventListener('mouseup', onMouseUp);

function onTouchStart(e) {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  currentX = 0;
  isDragging = true;
  lockedAxis = null;
  track.style.transition = 'none';
}

function onTouchMove(e) {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;

  if (!lockedAxis) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) lockedAxis = 'h';
    else if (Math.abs(dy) > 5) lockedAxis = 'v';
  }

  if (lockedAxis === 'h') {
    e.preventDefault();
    currentX = dx;
    const base = -currentSlide * 100;
    const pct = (dx / outer.offsetWidth) * 100;
    track.style.transform = `translateX(calc(${base}% + ${dx}px))`;
  }
}

function onTouchEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  lockedAxis = null;
  if (Math.abs(currentX) > SWIPE_THRESHOLD) {
    if (currentX < 0 && currentSlide < slides.length - 1) currentSlide++;
    else if (currentX > 0 && currentSlide > 0) currentSlide--;
  }
  applyTransform(true);
}

let mouseDown = false;
function onMouseDown(e) {
  mouseDown = true;
  startX = e.clientX;
  currentX = 0;
  track.style.transition = 'none';
}
function onMouseMove(e) {
  if (!mouseDown) return;
  currentX = e.clientX - startX;
  const base = -currentSlide * 100;
  track.style.transform = `translateX(calc(${base}% + ${currentX}px))`;
}
function onMouseUp(e) {
  if (!mouseDown) return;
  mouseDown = false;
  if (Math.abs(currentX) > SWIPE_THRESHOLD) {
    if (currentX < 0 && currentSlide < slides.length - 1) currentSlide++;
    else if (currentX > 0 && currentSlide > 0) currentSlide--;
  }
  applyTransform(true);
}

/* ===== INIT ===== */
fullRestart();
</script>
